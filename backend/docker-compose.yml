version: '3.8'

services:

  # ── RabbitMQ ────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - kind

  # ── API ─────────────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
      - ~/.kube/config:/root/.kube/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - kind
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Worker ──────────────────────────────────────────────────────────────
  # Misma imagen que la API, diferente CMD — cero overhead extra de build
  worker:
    build: .
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
      - ~/.kube/config:/root/.kube/config:ro
    networks:
      - kind
    command: python -m app.workers.deployment_worker
    restart: on-failure  # Si RabbitMQ no está listo, reintenta

  # ── Observability ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - kind

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - kind

networks:
  kind:
    external: true
