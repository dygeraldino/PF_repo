version: '3.8'

services:

  # ── RabbitMQ ────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API ─────────────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
      - ${HOME:-~}/.kube/config:/root/.kube/config:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Worker ──────────────────────────────────────────────────────────────
  # Misma imagen que la API, diferente CMD — cero overhead extra de build
  worker:
    build: .
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
      - ${HOME:-~}/.kube/config:/root/.kube/config:ro
    command: python -m app.workers.deployment_worker
    restart: on-failure  # Si RabbitMQ no está listo, reintenta
