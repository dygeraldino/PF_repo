apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ resource_name }}
  namespace: {{ namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: {{ service_name }}.13.86.117.95.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ resource_name }}
            port:
              number: 80
